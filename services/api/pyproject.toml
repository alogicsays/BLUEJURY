[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bluejury-api"
version = "0.1.0"
description = "BLUEJURY AI decision API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "geoalchemy2>=0.18,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "xarray>=2025.6,<2027",
  "zarr>=2.18,<3",
  "fsspec>=2025.7,<2027",
  "aiohttp>=3.12,<4",
  "numpy>=2.2,<3",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "pyshp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bluejury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
