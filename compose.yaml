services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bluejury
      POSTGRES_USER: bluejury
      POSTGRES_PASSWORD: bluejury
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluejury -d bluejury"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bluejury-postgres:/var/lib/postgresql/data

volumes:
  bluejury-postgres:

